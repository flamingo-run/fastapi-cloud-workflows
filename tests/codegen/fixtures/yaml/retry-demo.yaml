main:
  params:
  - payload
  steps:
  - call_retry-entry:
      call: http.post
      args:
        url: ${sys.get_env("BASE_URL") + "/steps/retry-entry"}
        body: ${payload}
        headers:
          X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
          Content-Type: application/json
        auth:
          type: OIDC
          audience: ${sys.get_env("BASE_URL")}
        timeout: 30
      result: res_0
      retry:
        predicate: ${http.default_retry_predicate}
        max_retries: 3
        backoff:
          initial_delay: 2.0
          max_delay: 10.0
          multiplier: 2.0
  - set_payload_0:
      assign:
      - payload: ${res_0.body}
  - capture_run_id_0:
      assign:
      - run_id: ${res_0.headers["X-Workflow-Run-Id"]}
  - call_retry-gateway:
      call: http.post
      args:
        url: https://api.example.com/payments
        body: ${payload}
        headers:
          X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
          X-Workflow-Run-Id: ${run_id}
          Content-Type: application/json
        timeout: 60
      result: res_1
      retry:
        predicate: ${http.default_retry_predicate}
        max_retries: 5
        backoff:
          initial_delay: 1.0
          max_delay: 30.0
          multiplier: 2.0
  - set_payload_1:
      assign:
      - payload: ${res_1.body}
  - call_retry-finalize:
      call: http.post
      args:
        url: ${sys.get_env("BASE_URL") + "/steps/retry-finalize"}
        body: ${payload}
        headers:
          X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
          X-Workflow-Run-Id: ${run_id}
          Content-Type: application/json
        auth:
          type: OIDC
          audience: ${sys.get_env("BASE_URL")}
      result: res_2
  - set_payload_2:
      assign:
      - payload: ${res_2.body}
  - return_final:
      return: ${payload}
