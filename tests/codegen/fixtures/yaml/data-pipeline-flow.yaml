main:
  params:
  - payload
  steps:
  - try_catch_pipeline-with-cleanup:
      try:
        steps:
        - try_catch_extract-with-recovery:
            try:
              steps:
              - call_extract-data:
                  call: http.post
                  args:
                    url: ${sys.get_env("BASE_URL") + "/steps/extract-data"}
                    body: ${payload}
                    headers:
                      X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      Content-Type: application/json
                    auth:
                      type: OIDC
                      audience: ${sys.get_env("BASE_URL")}
                    timeout: 120
                  result: res_0
                  retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                      initial_delay: 5.0
                      max_delay: 60.0
                      multiplier: 2.0
              - set_payload_0:
                  assign:
                  - payload: ${res_0.body}
              - capture_run_id_0:
                  assign:
                  - run_id: ${res_0.headers["X-Workflow-Run-Id"]}
              - call_validate-data:
                  call: http.post
                  args:
                    url: ${sys.get_env("BASE_URL") + "/steps/validate-data"}
                    body: ${payload}
                    headers:
                      X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      X-Workflow-Run-Id: ${run_id}
                      Content-Type: application/json
                    auth:
                      type: OIDC
                      audience: ${sys.get_env("BASE_URL")}
                  result: res_1
              - set_payload_1:
                  assign:
                  - payload: ${res_1.body}
            except:
              as: extract_error
              steps:
              - call_handle-extraction-error:
                  call: http.post
                  args:
                    url: ${sys.get_env("BASE_URL") + "/steps/handle-extraction-error"}
                    body: ${payload}
                    headers:
                      X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      X-Workflow-Run-Id: ${run_id}
                      Content-Type: application/json
                    auth:
                      type: OIDC
                      audience: ${sys.get_env("BASE_URL")}
                  result: res_50
              - set_payload_50:
                  assign:
                  - payload: ${res_50.body}
        - try_catch_transform-with-recovery:
            try:
              steps:
              - call_transform-data:
                  call: http.post
                  args:
                    url: ${sys.get_env("BASE_URL") + "/steps/transform-data"}
                    body: ${payload}
                    headers:
                      X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      X-Workflow-Run-Id: ${run_id}
                      Content-Type: application/json
                    auth:
                      type: OIDC
                      audience: ${sys.get_env("BASE_URL")}
                  result: res_100
                  retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 2
                    backoff:
                      initial_delay: 1.0
                      max_delay: 5.0
                      multiplier: 2.0
              - set_payload_100:
                  assign:
                  - payload: ${res_100.body}
              - call_quality-check:
                  call: http.post
                  args:
                    url: https://jsonplaceholder.typicode.com/posts
                    body: ${payload}
                    headers:
                      X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      X-Workflow-Run-Id: ${run_id}
                      Content-Type: application/json
                    timeout: 30
                  result: res_101
                  retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 5
                    backoff:
                      initial_delay: 1.0
                      max_delay: 30.0
                      multiplier: 2.0
              - set_payload_101:
                  assign:
                  - payload: ${res_101.body}
            except:
              as: transform_error
              steps:
              - call_handle-transform-error:
                  call: http.post
                  args:
                    url: ${sys.get_env("BASE_URL") + "/steps/handle-transform-error"}
                    body: ${payload}
                    headers:
                      X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                      X-Workflow-Run-Id: ${run_id}
                      Content-Type: application/json
                    auth:
                      type: OIDC
                      audience: ${sys.get_env("BASE_URL")}
                  result: res_150
              - set_payload_150:
                  assign:
                  - payload: ${res_150.body}
        - call_load-data:
            call: http.post
            args:
              url: ${sys.get_env("BASE_URL") + "/steps/load-data"}
              body: ${payload}
              headers:
                X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                X-Workflow-Run-Id: ${run_id}
                Content-Type: application/json
              auth:
                type: OIDC
                audience: ${sys.get_env("BASE_URL")}
            result: res_2
        - set_payload_2:
            assign:
            - payload: ${res_2.body}
      except:
        as: pipeline_error
        steps:
        - call_cleanup-on-error:
            call: http.post
            args:
              url: ${sys.get_env("BASE_URL") + "/steps/cleanup-on-error"}
              body: ${payload}
              headers:
                X-Workflow-Name: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                X-Workflow-Run-Id: ${run_id}
                Content-Type: application/json
              auth:
                type: OIDC
                audience: ${sys.get_env("BASE_URL")}
            result: res_50
        - set_payload_50:
            assign:
            - payload: ${res_50.body}
  - return_final:
      return: ${payload}
